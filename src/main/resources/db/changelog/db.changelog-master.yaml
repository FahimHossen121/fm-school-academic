databaseChangeLog:
  - changeSet:
      id: 001-create-students
      author: fm-school
      changes:
        - createTable:
            tableName: students
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: roll
                  type: VARCHAR(255)