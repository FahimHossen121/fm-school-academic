<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Accounts')}"></head>
  <body>
    <a class="sr-only focus:not-sr-only" href="#main-content"
      >Skip to content</a
    >
    <aside th:replace="~{fragments/layout :: navigation}"></aside>
    <main id="main-content" class="workspace">
      <div class="page-content">
        <header class="page-top">
          <p class="eyebrow">FM SCHOOL / WORKSPACE</p>
          <h1>Accounts</h1>
          <p>Your school accounts.</p>
        </header>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/admin/accounts/new}">Create Account</a>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="account : ${accounts}">
                <td th:text="${account.id}"></td>
                <td th:text="${account.username}"></td>
                <td th:text="${account.role}"></td>
                <td>
                  <a
                    th:if="${account.role.name() != 'ADMIN'}"
                    th:href="@{/admin/accounts/{id}/profile(id=${account.id})}"
                    >Manage Profile</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
