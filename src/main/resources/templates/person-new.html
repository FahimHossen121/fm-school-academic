<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Create Account')}"></head>
  <body>
    <a class="sr-only focus:not-sr-only" href="#main-content"
      >Skip to content</a
    >
    <aside th:replace="~{fragments/layout :: navigation}"></aside>
    <main id="main-content" class="workspace">
      <div class="page-content">
        <header class="page-top">
          <p class="eyebrow">FM SCHOOL / WORKSPACE</p>
          <h1 th:text="${title}"></h1>
          <p>Create a login, then complete the personal profile.</p>
        </header>
        <p>First choose login credentials. Next, enter the personal profile.</p>
        <section class="panel form-panel">
          <form
            th:action="@{${savePath}}"
            th:object="${accountForm}"
            method="post"
            class="field-form"
          >
            <ul role="alert" th:if="${#fields.hasAnyErrors()}">
              <li
                th:each="error : ${#fields.allErrors()}"
                th:text="${error}"
              ></li>
            </ul>
            <input type="hidden" th:field="*{role}" />
            <p>
              <label for="username">Username</label>
              <input
                id="username"
                type="text"
                th:field="*{username}"
                autocomplete="off"
              />
            </p>
            <p>
              <label for="password">Password (8–64 characters)</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
              />
            </p>
            <button type="submit">Continue to Profile</button>
          </form>
        </section>
        <a th:href="@{${savePath}}">Back</a>
      </div>
    </main>
  </body>
</html>
