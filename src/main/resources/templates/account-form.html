<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Create Account | FM School</title></head>
<body>
<h1>Create Teacher or Student Account</h1>
<form th:action="@{/admin/accounts}" th:object="${accountForm}" method="post">
    <ul th:if="${#fields.hasAnyErrors()}">
        <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
    </ul>
    <p><label for="username">Username</label>
        <input id="username" type="text" th:field="*{username}" autocomplete="off"></p>
    <p><label for="password">Password (8–64 characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password"></p>
    <p><label for="role">Role</label>
        <select id="role" th:field="*{role}">
            <option value="">Choose a role</option>
            <option th:each="role : ${availableRoles}" th:value="${role}" th:text="${role}"></option>
        </select></p>
    <button type="submit">Create Account</button>
</form>
<a th:href="@{/admin/accounts}">Back to accounts</a>
<p>After creation, use Manage Profile to enter personal details, or let the user complete My Profile.</p>
</body>
</html>
