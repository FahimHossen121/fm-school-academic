<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Signup Choice')}"></head>
  <body>
    <div class="auth-layout">
      <section th:replace="~{fragments/layout :: authStory}"></section>
      <main class="auth-main">
        <div class="auth-card">
          <a th:replace="~{fragments/layout :: brand}"></a>
          <p class="eyebrow text-school">YOUR SCHOOL, SIMPLIFIED</p>
          <h1>Create your FM School account</h1>
          <p class="helper">Choose your role to get started.</p>
          <div class="mt-8">
            <a class="role-card" th:href="@{/signup/student}"
              ><strong>I’m a student <b aria-hidden="true">↗</b></strong
              ><span
                >Find a teacher, join a course, and follow your progress.</span
              ></a
            ><a class="role-card" th:href="@{/signup/teacher}"
              ><strong>I’m a teacher <b aria-hidden="true">↗</b></strong
              ><span
                >Welcome students into your course and support their
                learning.</span
              ></a
            >
          </div>
          <p class="auth-links">
            <a th:href="@{/login}">Already have an account? Sign in</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
