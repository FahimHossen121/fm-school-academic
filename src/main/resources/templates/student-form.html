<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Student Form')}"></head>
  <body>
    <a class="sr-only focus:not-sr-only" href="#main-content"
      >Skip to content</a
    >
    <aside th:replace="~{fragments/layout :: navigation}"></aside>
    <main id="main-content" class="workspace">
      <div class="page-content">
        <header class="page-top">
          <p class="eyebrow">FM SCHOOL / WORKSPACE</p>
          <h1>Add Student</h1>
          <p>Add a student to your school community.</p>
        </header>
        <section class="panel form-panel">
          <form
            th:action="@{/students}"
            th:object="${studentForm}"
            method="post"
            class="field-form"
          >
            <p>
              <label for="name">Name</label>
              <input id="name" type="text" th:field="*{name}" />
            </p>
            <span
              th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
            ></span>

            <p>
              <label for="roll">Roll</label>
              <input
                id="roll"
                inputmode="numeric"
                type="text"
                th:field="*{roll}"
              />
            </p>
            <span
              th:if="${#fields.hasErrors('roll')}"
              th:errors="*{roll}"
            ></span>
            <button type="submit">Save Student</button>
          </form>
        </section>

        <a th:href="@{/students}">Back to students</a>
      </div>
    </main>
  </body>
</html>
