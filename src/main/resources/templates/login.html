<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | FM School</title>
</head>
<body>
<main>
    <h1>Sign in to FM School</h1>
    <p th:if="${param.error}" role="alert">Invalid username or password.</p>
    <p th:if="${param.logout}">You have been logged out.</p>
    <p th:if="${param.deleted}">Your account has been deleted.</p>
    <p th:if="${param.registered}" role="status">Account created. Sign in with your new username and password.</p>
    <form th:action="@{/login}" method="post">
        <p>
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" required autofocus>
        </p>
        <p>
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </p>
        <button type="submit">Sign in</button>
    </form>
    <p><a th:href="@{/signup/student}">Sign up as a Student</a></p>
    <p><a th:href="@{/signup/teacher}">Sign up as a Teacher</a></p>
</main>
</body>
</html>
