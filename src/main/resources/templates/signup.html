<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Signup')}"></head>
  <body>
    <div class="auth-layout">
      <section th:replace="~{fragments/layout :: authStory}"></section>
      <main class="auth-main">
        <div class="auth-card">
          <a th:replace="~{fragments/layout :: brand}"></a>
          <p class="eyebrow text-school">YOUR SCHOOL, SIMPLIFIED</p>
          <h1 th:text="${isStudent ? 'Student Signup' : 'Teacher Signup'}"></h1>
          <p class="helper">A new connection starts with a few details.</p>
          <form
            th:action="@{${signupPath}}"
            th:object="${signupForm}"
            method="post"
            class="field-form"
          >
            <ul role="alert" th:if="${#fields.hasAnyErrors()}">
              <li
                th:each="error : ${#fields.allErrors()}"
                th:text="${error}"
              ></li>
            </ul>
            <p>
              <label for="username">Username</label>
              <input
                id="username"
                type="text"
                th:field="*{username}"
                autocomplete="username"
              />
            </p>
            <p>
              <label for="name">Name</label>
              <input
                id="name"
                type="text"
                th:field="*{name}"
                autocomplete="name"
              />
            </p>
            <p>
              <label for="password">Password (8–64 characters)</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
              />
            </p>
            <p th:if="${isStudent}">
              <label for="roll">Roll</label>
              <input
                id="roll"
                inputmode="numeric"
                type="text"
                th:field="*{roll}"
              />
            </p>
            <p th:unless="${isStudent}">
              <label for="course">Course</label>
              <input id="course" type="text" th:field="*{course}" />
            </p>
            <button type="submit">Create Account</button>
          </form>
          <div class="auth-links">
            <p><a th:href="@{/signup}">Choose another role</a></p>
            <p><a th:href="@{/login}">Already have an account? Sign in</a></p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
