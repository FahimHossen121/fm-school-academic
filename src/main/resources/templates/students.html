<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students | FM School</title>
</head>
<body>
<h1>Students</h1>
<a th:href="@{/}">Home</a>
<a th:href="@{/students/new}">Add Student</a>

<p th:if="${#lists.isEmpty(students)}">
    No students have been added yet.
</p>

<table th:unless="${#lists.isEmpty(students)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Roll</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.roll}"></td>
        <td>
            <a th:href="@{/students/{id}/edit(id=${student.id})}">Edit</a>
            <form th:action="@{/students/{id}/delete(id=${student.id})}"
                  method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
