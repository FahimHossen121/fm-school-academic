<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Profile')}"></head>
  <body>
    <a class="sr-only focus:not-sr-only" href="#main-content"
      >Skip to content</a
    >
    <aside th:replace="~{fragments/layout :: navigation}"></aside>
    <main id="main-content" class="workspace">
      <div class="page-content">
        <header class="page-top">
          <p class="eyebrow">FM SCHOOL / WORKSPACE</p>
          <h1 th:text="${adminMode ? 'Manage Profile' : 'My Profile'}"></h1>
          <p>Your personal details, all in one place.</p>
        </header>
        <p>
          Account: <strong th:text="${profile.username}"></strong> (<span
            th:text="${profile.role}"
          ></span
          >)
        </p>
        <p th:if="${profile.recordId != null}">
          Record ID: <span th:text="${profile.recordId}"></span>
        </p>
        <p th:if="${param.saved}" role="status">Profile saved.</p>
        <section class="panel form-panel">
          <h2>Personal information</h2>
          <form
            th:action="@{${savePath}}"
            th:object="${profileForm}"
            method="post"
            class="field-form"
          >
            <ul role="alert" th:if="${#fields.hasAnyErrors()}">
              <li
                th:each="error : ${#fields.allErrors()}"
                th:text="${error}"
              ></li>
            </ul>
            <p>
              <label for="name">Name</label>
              <input id="name" type="text" th:field="*{name}" />
            </p>
            <p th:if="${isStudent}">
              <label for="roll">Roll</label>
              <input
                id="roll"
                inputmode="numeric"
                type="text"
                th:field="*{roll}"
              />
            </p>
            <p th:unless="${isStudent}">
              <label for="course">Course</label>
              <input id="course" type="text" th:field="*{course}" />
            </p>
            <button type="submit">Save Profile</button>
          </form>
        </section>
        <section class="danger-panel">
          <h2
            th:text="${adminMode ? 'Delete this account' : 'Delete my account'}"
          ></h2>
          <p>
            This removes the login and its linked personal record. Other
            accounts remain.
          </p>
          <form th:action="@{${deletePath}}" method="post">
            <button class="danger-button" type="submit">Delete Account</button>
          </form>
        </section>
        <a
          th:if="${adminMode}"
          th:href="@{${managementPath}}"
          th:text="${isStudent ? '← Back to Students' : '← Back to Teachers'}"
        ></a>
      </div>
    </main>
  </body>
</html>
