name: FM School tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fm_school_test
          POSTGRES_USER: fm_school_test
          POSTGRES_PASSWORD: fm_school_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fm_school_test -d fm_school_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run unit and PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress verify
